  /admin/vigencias/{id}/activar:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Vigencias y cupos]
      summary: 'Activar una vigencia'
      description: 'Solo una vigencia está activa a la vez: la que recibe las preinscripciones.'
      security: [{ bearerInterno: [] }]
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vigencia' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/ReglaDeNegocio' }
  /admin/vigencias/{id}/versiones:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Vigencias y cupos]
      summary: 'Historial de versiones de una vigencia'
      security: [{ bearerInterno: [] }]
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    {
                      items:
                        { type: array, items: { $ref: '#/components/schemas/VersionRegistro' } },
                    },
                }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /admin/autorizacion:
    get:
      tags: [Texto de autorización]
      summary: 'Texto vigente y versiones anteriores (RF-PRE-03)'
      security: [{ bearerInterno: [] }]
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutorizacionEstado' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
    post:
      tags: [Texto de autorización]
      summary: 'Publicar una versión nueva del texto'
      description: 'Las aceptaciones anteriores conservan la versión que aceptaron.'
      security: [{ bearerInterno: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutorizacionEntrada' }
      responses:
        '201':
          description: Correcto
          content:
            application/json:
              schema: { type: object, properties: { version: { type: integer } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/ReglaDeNegocio' }
        '422': { $ref: '#/components/responses/Validacion' }
  /admin/plantillas:
    get:
      tags: [Plantillas de correo]
      summary: 'Listar las plantillas de correo'
      security: [{ bearerInterno: [] }]
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    {
                      items:
                        { type: array, items: { $ref: '#/components/schemas/PlantillaResumen' } },
                    },
                }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
  /admin/plantillas/{codigo}:
    parameters:
      - { name: codigo, in: path, required: true, schema: { type: string } }
    get:
      tags: [Plantillas de correo]
      summary: 'Plantilla con su versión vigente, variables y versiones'
      security: [{ bearerInterno: [] }]
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plantilla' }
        '400': { $ref: '#/components/responses/ReglaDeNegocio' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /admin/plantillas/{codigo}/vista-previa:
    parameters:
      - { name: codigo, in: path, required: true, schema: { type: string } }
    post:
      tags: [Plantillas de correo]
      summary: 'Vista previa con datos de ejemplo'
      description: 'Señala variables desconocidas o faltantes sin impedir ver el resultado.'
      security: [{ bearerInterno: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlantillaEntrada' }
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VistaPrevia' }
        '400': { $ref: '#/components/responses/ReglaDeNegocio' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }
  /admin/plantillas/{codigo}/versiones:
    parameters:
      - { name: codigo, in: path, required: true, schema: { type: string } }
    post:
      tags: [Plantillas de correo]
      summary: 'Guardar una versión nueva de la plantilla'
      description: 'Solo variables permitidas y con todas las obligatorias.'
      security: [{ bearerInterno: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlantillaVersionEntrada' }
      responses:
        '201':
          description: Correcto
          content:
            application/json:
              schema: { type: object, properties: { version: { type: integer } } }
        '400': { $ref: '#/components/responses/ReglaDeNegocio' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/ReglaDeNegocio' }
        '422': { $ref: '#/components/responses/Validacion' }
components:
  securitySchemes:
    bearerCiudadano:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Sesión de consulta del ciudadano (30 minutos), obtenida con el código o el enlace seguro.
    bearerInterno:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso de 10 minutos obtenido en `/auth/login`.
  parameters:
    CabeceraPortal:
      name: X-Requested-With
      in: header
      required: true
      schema: { type: string, enum: [estimulo-portal] }
      description: Cabecera que solo agrega el portal (defensa CSRF).
  schemas:
    Salud:
      type: object
      required: [estado, baseDeDatos]
      properties:
        estado: { type: string, enum: [ok, degradado] }
        baseDeDatos: { type: string, enum: [ok, sin_conexion] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [codigo, mensaje]
          properties:
            codigo: { type: string }
            mensaje: { type: string }
            errores:
              type: array
              items:
                type: object
                properties:
                  campo: { type: string }
                  mensaje: { type: string }
            detalle: {}
    Login:
      type: object
      required: [usuario, password]
      properties:
        usuario: { type: string }
        password: { type: string }
    Perfil:
      type: object
      properties:
        id: { type: integer }
        usuario: { type: string }
        nombres: { type: string }
        correo: { type: string }
        roles:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              codigo: { type: string }
              nombre: { type: string }
        permisos:
          type: array
          items: { type: string }
        debeCambiarPassword: { type: boolean }
    SesionIniciada:
      type: object
      properties:
        token: { type: string }
        perfil: { $ref: '#/components/schemas/Perfil' }
        inactividadMinutos: { type: integer }
    Rol:
      type: object
      properties:
        id: { type: integer }
        codigo: { type: string }
        nombre: { type: string }
        descripcion: { type: string }
        sistema:
          {
            type: boolean,
            description: 'Rol del documento (numeral 3.2): no se elimina ni se renombra',
          }
        usuarios: { type: integer, description: Usuarios que tienen este rol }
        permisos:
          type: array
          items: { type: string }
    RolEntrada:
      type: object
      required: [nombre, descripcion, permisos]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 60 }
        descripcion: { type: string, minLength: 3, maxLength: 250 }
        permisos:
          type: array
          items: { type: string, example: catalogos.administrar }
    Permiso:
      type: object
      properties:
        codigo: { type: string, example: usuarios.administrar }
        modulo: { type: string }
        descripcion: { type: string }
    RolAsignado:
      type: object
      description: El rol del usuario (cada usuario tiene uno solo)
      properties:
        id: { type: integer }
        codigo: { type: string }
        nombre: { type: string }
    Usuario:
      type: object
      properties:
        id: { type: integer }
        usuario: { type: string }
        nombres: { type: string }
        correo: { type: string }
        estado: { type: string, enum: [ACTIVO, BLOQUEADO, BAJA] }
        bloqueoTemporalHasta: { type: string, format: date-time, nullable: true }
        debeCambiarPassword: { type: boolean }
        protegido: { type: boolean }
        ultimoLoginAt: { type: string, format: date-time, nullable: true }
        creadoAt: { type: string, format: date-time }
        rol:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RolAsignado'
    UsuarioNuevo:
      type: object
      required: [usuario, nombres, correo, rolId]
      properties:
        usuario:
          { type: string, description: '3 a 40 caracteres: minúsculas, números, punto, guion' }
        nombres: { type: string }
        correo: { type: string, format: email }
        rolId: { type: integer, description: El rol del usuario (uno solo) }
    UsuarioEdicion:
      type: object
      required: [nombres, correo, rolId]
      properties:
        nombres: { type: string }
        correo: { type: string, format: email }
        rolId: { type: integer, description: El rol del usuario (uno solo; reemplaza al anterior) }
    ResumenCatalogo:
      type: object
      properties:
        catalogo: { type: string }
        total: { type: integer }
        activos: { type: integer }
    ItemCatalogo:
      type: object
      properties:
        id: { type: integer }
        catalogo: { type: string }
        codigo: { type: string }
        nombre: { type: string }
        padreId: { type: integer, nullable: true, description: Localidad del barrio }
        padreNombre: { type: string, nullable: true }
        activo: { type: boolean }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
    ItemEntrada:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string }
        codigo: { type: string, description: Opcional; obligatorio en tipos de identificación }
        padreId: { type: integer, nullable: true, description: Obligatorio en barrios }
    VersionRegistro:
      type: object
      properties:
        version: { type: integer }
        snapshot: { type: object, description: Copia completa del registro en esa versión }
        usuario: { type: string, nullable: true }
        creadoAt: { type: string, format: date-time }
    DocumentoRequerido:
      type: object
      properties:
        id: { type: integer }
        codigo: { type: string }
        nombre: { type: string }
        descripcion: { type: string }
        aplicaA: { type: string, enum: [PCD, CUIDADOR, COMUN] }
        obligatorio: { type: boolean }
        activo: { type: boolean }
        version: { type: integer }
        modelo:
          type: object
          nullable: true
          description: Modelo descargable que publicó la Gerencia (por ejemplo, la carta de solicitud)
          properties:
            nombre: { type: string }
            formato: { type: string, enum: [pdf, docx, odt] }
            tamanoBytes: { type: integer }
            cargadoAt: { type: string, format: date-time }
    DocumentoEntrada:
      type: object
      required: [nombre, aplicaA, obligatorio]
      properties:
        nombre: { type: string }
        descripcion: { type: string }
        aplicaA: { type: string, enum: [PCD, CUIDADOR, COMUN] }
        obligatorio: { type: boolean }
    VersionParametro:
      type: object
      properties:
        id: { type: integer }
        valor: { type: string }
        vigenteDesde: { type: string, format: date-time }
        aprobadoPor: { type: string, nullable: true }
        justificacion: { type: string, nullable: true }
        creadoAt: { type: string, format: date-time }
    Parametro:
      type: object
      properties:
        clave: { type: string }
        grupo: { type: string }
        descripcion: { type: string }
        tipo: { type: string, enum: [ENTERO, TEXTO, BOOLEANO] }
        minimo: { type: integer, nullable: true }
        maximo: { type: integer, nullable: true }
        patron: { type: string, nullable: true }
        pendienteDefinicion:
          { type: boolean, description: Valor inicial a confirmar por la Gerencia }
        vigente: { $ref: '#/components/schemas/VersionParametro' }
        programada: { allOf: [{ $ref: '#/components/schemas/VersionParametro' }], nullable: true }
    VersionParametroEntrada:
      type: object
      required: [valor, justificacion]
      properties:
        valor: { type: string }
        vigenteDesde:
          { type: string, format: date-time, nullable: true, description: Vacío = desde ya }
        justificacion: { type: string, minLength: 5 }
    Vigencia:
      type: object
      properties:
        id: { type: integer }
        anio: { type: integer }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }
        cuposTotales: { type: integer }
        activa: { type: boolean }
        version: { type: integer }
    VigenciaNueva:
      type: object
      required: [anio, fechaInicio, fechaFin, cuposTotales]
      properties:
        anio: { type: integer }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }
        cuposTotales: { type: integer, minimum: 0 }
    VigenciaEdicion:
      type: object
      required: [fechaInicio, fechaFin, cuposTotales]
      properties:
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }
        cuposTotales: { type: integer, minimum: 0 }
    TextoAutorizacion:
      type: object
      properties:
        version: { type: integer }
        contenido: { type: string }
        vigenteDesde: { type: string, format: date-time }
        creadoPor: { type: string, nullable: true }
    AutorizacionEstado:
      type: object
      properties:
        vigente: { $ref: '#/components/schemas/TextoAutorizacion' }
        versiones:
          type: array
          items: { $ref: '#/components/schemas/TextoAutorizacion' }
    AutorizacionEntrada:
      type: object
      required: [contenido]
      properties:
        contenido: { type: string, minLength: 50, maxLength: 20000 }
    PlantillaResumen:
      type: object
      properties:
        codigo: { type: string }
        nombre: { type: string }
        descripcion: { type: string }
        version: { type: integer }
        actualizadaAt: { type: string, format: date-time }
    PlantillaVersion:
      type: object
      properties:
        version: { type: integer }
        asunto: { type: string }
        cuerpo: { type: string }
        justificacion: { type: string, nullable: true }
        creadoPor: { type: string, nullable: true }
        creadoAt: { type: string, format: date-time }
    Plantilla:
      type: object
      properties:
        codigo: { type: string }
        nombre: { type: string }
        descripcion: { type: string }
        variables:
          type: array
          items:
            type: object
            properties:
              nombre: { type: string }
              descripcion: { type: string }
              obligatoria: { type: boolean }
        vigente: { $ref: '#/components/schemas/PlantillaVersion' }
        versiones:
          type: array
          items: { $ref: '#/components/schemas/PlantillaVersion' }
    PlantillaEntrada:
      type: object
      required: [asunto, cuerpo]
      properties:
        asunto: { type: string }
        cuerpo: { type: string }
    PlantillaVersionEntrada:
      type: object
      required: [asunto, cuerpo]
      properties:
        asunto: { type: string }
        cuerpo: { type: string }
        justificacion: { type: string, nullable: true }
    VistaPrevia:
      type: object
      properties:
        asunto: { type: string }
        cuerpo: { type: string }
        variablesUsadas:
          type: array
          items: { type: string }
        problemas:
          type: array
          items: { type: string }
    FormularioPreinscripcion:
      type: object
      properties:
        abierta:
          { type: boolean, description: Hay una vigencia activa y hoy está dentro de sus fechas }
        anio: { type: integer, nullable: true }
        tiposIdentificacion:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              codigo: { type: string }
              nombre: { type: string }
        localidades:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              nombre: { type: string }
        barrios:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              nombre: { type: string }
              localidadId: { type: integer, nullable: true }
        autorizacion:
          type: object
          nullable: true
          properties:
            version: { type: integer }
            contenido: { type: string }
        formularioToken:
          {
            type: string,
            description: Se devuelve en el envío; sirve para detectar envíos automatizados,
          }
    PreinscripcionEntrada:
      type: object
      required:
        [
          pcdNombre,
          pcdTipoIdentificacionId,
          pcdNumero,
          cuidadorNombre,
          cuidadorTipoIdentificacionId,
          cuidadorNumero,
          correo,
          aceptaAutorizacion,
          autorizacionVersion,
          formularioToken,
        ]
      properties:
        pcdNombre: { type: string }
        pcdTipoIdentificacionId: { type: integer }
        pcdNumero: { type: string }
        cuidadorNombre: { type: string }
        cuidadorTipoIdentificacionId: { type: integer }
        cuidadorNumero: { type: string }
        direccion:
          type: string
          nullable: true
          description: 'Opcional. Formato estándar armado por el portal: tipo de vía, número, # cruce - placa y complemento. Ejemplo: Carrera 54 B Bis Sur # 72 A - 30 Este, Apto 301'
          example: Calle 72 # 54 - 30
        localidadId: { type: integer, nullable: true }
        barrioId: { type: integer, nullable: true }
        correo: { type: string, format: email }
        aceptaAutorizacion: { type: boolean, enum: [true] }
        autorizacionVersion: { type: integer }
        formularioToken: { type: string }
        contactoAlterno: { type: string, description: 'Campo trampa: debe ir vacío' }
    PreinscripcionCreada:
      type: object
      properties:
        correoEnmascarado: { type: string, example: 'f****@correo.com' }
        horasVigenciaEnlace: { type: integer }
    IdentificacionPcd:
      type: object
      required: [tipoIdentificacionId, numero]
      properties:
        tipoIdentificacionId: { type: integer }
        numero: { type: string, description: Identificación de la persona con discapacidad }
    SesionConsulta:
      type: object
      properties:
        token: { type: string, description: Token de la sesión del ciudadano; se envía como Bearer }
        expiraEnMinutos: { type: integer }
    ItemLista:
      type: object
      properties:
        id: { type: integer }
        codigo: { type: string }
        nombre: { type: string }
    DatosCaracterizacion:
      type: object
      description: Todos los campos pueden ser nulos mientras la persona va diligenciando.
      properties:
        generoId: { type: integer, nullable: true }
        telefonoFijo:
          { type: string, nullable: true, description: '7 dígitos, o 10 con el indicativo 60' }
        celular: { type: string, nullable: true, description: '10 dígitos que empiezan por 3' }
        fechaNacimiento: { type: string, format: date, nullable: true }
        estadoCivilId: { type: integer, nullable: true }
        tieneHijos: { type: boolean, nullable: true }
        hijosCantidad: { type: integer, minimum: 1, maximum: 20, nullable: true }
        hijosEdades:
          type: array
          nullable: true
          description: Una edad por hijo (0 a 100); una posición nula es una edad que falta
          items: { type: integer, nullable: true }
        etniaId: { type: integer, nullable: true }
        escolaridadId: { type: integer, nullable: true }
        ocupacionId: { type: integer, nullable: true }
        epsId: { type: integer, nullable: true }
        embarazo: { type: string, enum: [NO, SI, NO_APLICA], nullable: true }
        semanasGestacion: { type: integer, minimum: 1, maximum: 42, nullable: true }
        recibeSubsidios: { type: boolean, nullable: true }
        subsidioCual: { type: string, nullable: true }
        tipoTransporteId: { type: integer, nullable: true }
        justificacionTransporte: { type: string, nullable: true }
        requiereCuidador: { type: boolean, nullable: true }
        cuidadorGeneroId: { type: integer, nullable: true }
        cuidadorTelefonoFijo: { type: string, nullable: true }
        cuidadorCelular: { type: string, nullable: true }
        cuidadorCorreo: { type: string, nullable: true }
    CaracterizacionCambios:
      allOf:
        - $ref: '#/components/schemas/DatosCaracterizacion'
        - type: object
          required: [version]
          properties:
            version:
              {
                type: integer,
                minimum: 0,
                description: La versión que la persona vio (0 si aún no hay nada guardado),
              }
            pcdNombre:
              {
                type: string,
                description: Corrige el nombre de la persona con discapacidad; queda en el historial,
              }
            cuidadorNombre:
              { type: string, description: Solo si el cuidador no figura en otra solicitud }
    SeccionAvance:
      type: object
      properties:
        codigo:
          { type: string, enum: [datos-personales, situacion, salud-apoyos, transporte, cuidador] }
        nombre: { type: string }
        requeridos: { type: integer }
        completados: { type: integer }
        completa: { type: boolean }
        faltantes:
          type: array
          items:
            type: object
            properties:
              campo: { type: string }
              mensaje: { type: string }
    Avance:
      type: object
      properties:
        secciones:
          type: array
          items: { $ref: '#/components/schemas/SeccionAvance' }
        requeridos: { type: integer }
        completados: { type: integer }
        porcentaje: { type: integer, minimum: 0, maximum: 100 }
        completa: { type: boolean }
    CaracterizacionGuardada:
      type: object
      properties:
        version: { type: integer }
        guardadoAt: { type: string, format: date-time, nullable: true }
        pcdNombre: { type: string }
        cuidadorNombre: { type: string }
        datos: { $ref: '#/components/schemas/DatosCaracterizacion' }
        avance: { $ref: '#/components/schemas/Avance' }
    Caracterizacion:
      type: object
      properties:
        solicitud:
          type: object
          properties:
            vigencia: { type: integer }
            estado:
              type: object
              properties:
                codigo: { type: string }
                nombre: { type: string }
            editable: { type: boolean }
            explicacion: { type: string }
            siguientePaso: { type: string }
            radicado: { type: string, nullable: true, example: EST-2026-000123 }
            radicadaAt: { type: string, format: date-time, nullable: true }
        pcd:
          type: object
          properties:
            nombre: { type: string }
            tipoIdentificacion: { $ref: '#/components/schemas/ItemLista' }
            numero: { type: string }
            correo: { type: string }
        cuidador:
          type: object
          properties:
            nombre: { type: string }
            tipoIdentificacion: { $ref: '#/components/schemas/ItemLista' }
            numero: { type: string }
            nombreEditable: { type: boolean }
        datos: { $ref: '#/components/schemas/DatosCaracterizacion' }
        avance: { $ref: '#/components/schemas/Avance' }
        version: { type: integer }
        guardadoAt: { type: string, format: date-time, nullable: true }
        catalogos:
          type: object
          properties:
            generos: { type: array, items: { $ref: '#/components/schemas/ItemLista' } }
            estadosCiviles: { type: array, items: { $ref: '#/components/schemas/ItemLista' } }
            etnias: { type: array, items: { $ref: '#/components/schemas/ItemLista' } }
            escolaridades: { type: array, items: { $ref: '#/components/schemas/ItemLista' } }
            ocupaciones: { type: array, items: { $ref: '#/components/schemas/ItemLista' } }
            eps: { type: array, items: { $ref: '#/components/schemas/ItemLista' } }
            tiposTransporte: { type: array, items: { $ref: '#/components/schemas/ItemLista' } }
    IdentificacionConsulta:
      type: object
      description: Con el radicado, o con el tipo y número de identificación de la persona con discapacidad.
      properties:
        radicado: { type: string, pattern: '^EST-[0-9]{4}-[0-9]{6}$', example: EST-2026-000123 }
        tipoIdentificacionId: { type: integer }
        numero: { type: string }
    ArchivoDocumento:
      type: object
      nullable: true
      properties:
        nombre: { type: string }
        formato: { type: string, enum: [pdf, jpg, png] }
        tamanoBytes: { type: integer }
        sha256: { type: string, description: Hash de integridad del contenido }
        cargadoAt: { type: string, format: date-time }
    DocumentoSolicitud:
      type: object
      properties:
        id: { type: integer }
        codigo: { type: string }
        nombre: { type: string }
        descripcion: { type: string }
        aplicaA: { type: string, enum: [PCD, CUIDADOR, COMUN] }
        obligatorio: { type: boolean }
        estado: { type: string, enum: [PENDIENTE, CARGADO, RECHAZADO] }
        reemplazos: { type: integer, description: Cuántas veces se reemplazó el archivo }
        archivo: { $ref: '#/components/schemas/ArchivoDocumento' }
        tieneModelo: { type: boolean }
    DocumentosSolicitud:
      type: object
      properties:
        editable: { type: boolean }
        reglas:
          type: object
          properties:
            formatos:
              type: array
              items: { type: string, enum: [pdf, jpg, png] }
            maxMb: { type: integer }
        documentos:
          type: array
          items: { $ref: '#/components/schemas/DocumentoSolicitud' }
        resumen:
          type: object
          properties:
            obligatorios: { type: integer }
            cargados: { type: integer }
            completo: { type: boolean }
    PendienteRadicacion:
      type: object
      properties:
        campo:
          { type: string, description: 'Nombre del campo, o «documento:ID» si es un documento' }
        seccion: { type: string }
        mensaje: { type: string }
    RevisionSolicitud:
      type: object
      properties:
        completo: { type: boolean }
        datos:
          type: array
          items: { $ref: '#/components/schemas/PendienteRadicacion' }
        documentos:
          type: array
          items: { $ref: '#/components/schemas/PendienteRadicacion' }
    Radicacion:
      type: object
      properties:
        radicado: { type: string, example: EST-2026-000123 }
        radicadaAt: { type: string, format: date-time }
        estado:
          type: object
          properties:
            codigo: { type: string }
            nombre: { type: string }
        explicacion: { type: string }
        siguientePaso: { type: string }
        aviso: { type: string }
    EstadoSolicitud:
      type: object
      properties:
        vigencia: { type: integer }
        personaConDiscapacidad: { type: string }
        correo: { type: string, example: 'f****@correo.com', description: Correo enmascarado }
        fechaPreinscripcion: { type: string, format: date-time }
        radicado: { type: string, nullable: true, example: EST-2026-000123 }
        fechaRadicacion: { type: string, format: date-time, nullable: true }
        etapa: { type: string }
        estado:
          type: object
          properties:
            codigo: { type: string }
            nombre: { type: string }
        explicacion: { type: string }
        siguientePaso: { type: string }
        aviso: { type: string }
        comunicaciones:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              nombre: { type: string }
              asunto: { type: string }
              enviadoAt: { type: string, format: date-time }
              entrega:
                {
                  type: string,
                  description: 'Pendiente de envío, Enviado, Entregado, No se pudo entregar o No se pudo enviar',
                }
    Motivo:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 5, maxLength: 500 }
  responses:
    DemasiadasPeticiones:
      description: Demasiadas peticiones desde esta conexión (`DEMASIADOS_INTENTOS`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Validacion:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoAutenticado:
      description: Sin sesión válida o credenciales incorrectas
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SinPermiso:
      description: El rol no tiene el permiso necesario
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoEncontrado:
      description: El recurso no existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ReglaDeNegocio:
      description: La operación viola una regla de negocio
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
