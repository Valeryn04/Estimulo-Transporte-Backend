openapi: 3.0.3
info:
  title: API del Estímulo Social de Transporte · Barranquilla
  version: 0.5.0
  description: |
    API RESTful versionada (`/api/v1`) de la plataforma del Estímulo Social de Transporte de la Alcaldía de
    Barranquilla (Acuerdo Distrital 0022 de 2025).

    **Autenticación del portal interno** (`/auth`, `/admin`): `POST /auth/login` entrega un **token de acceso JWT de
    10 minutos** (`bearerInterno`, que el navegador guarda solo en memoria) y deja el **refresh token** en la cookie
    `estimulo_rt` (HttpOnly, SameSite=Strict, `Path=/api/v1/auth`). `POST /auth/refresh` y `/auth/logout` exigen además
    la cabecera `X-Requested-With: estimulo-portal` (defensa contra CSRF). La sesión se cierra por inactividad y por
    un tope absoluto, ambos parametrizables.

    Los permisos se leen de la base de datos en **cada** petición: un cambio de rol, de vigencia o un bloqueo rige de
    inmediato, también para llamadas directas a la API.

    **Errores**: todos tienen la forma `{ "error": { "codigo", "mensaje", "errores?", "detalle?" } }`. Las
    validaciones responden 422 con la lista de campos a corregir.

    **Fechas**: instantes en UTC (ISO 8601); los «días de calendario» y las vigencias se calculan en `America/Bogota`.
servers:
  - url: /api/v1
    description: Versión 1 de la API
tags:
  - name: Salud
  - name: Portal ciudadano
  - name: Correo
  - name: Autenticación
  - name: Administración de usuarios
  - name: Catálogos
  - name: Documentos exigidos
  - name: Parámetros
  - name: Vigencias y cupos
  - name: Texto de autorización
  - name: Plantillas de correo

paths:
  /health:
    get:
      tags: [Salud]
      summary: Estado del servicio y de la base de datos
      responses:
        '200':
          description: Servicio y base de datos disponibles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salud' }
        '503':
          description: Sin conexión a la base de datos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salud' }

  /publico/preinscripcion/formulario:
    get:
      tags: [Portal ciudadano]
      summary: Datos del formulario de preinscripción
      description: 'Catálogos activos (tipos de identificación, localidades, barrios), texto de autorización vigente y el token del formulario (control contra envíos automatizados).'
      responses:
        '200':
          description: Datos del formulario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormularioPreinscripcion' }
        '429': { $ref: '#/components/responses/DemasiadasPeticiones' }

  /publico/preinscripciones:
    post:
      tags: [Portal ciudadano]
      summary: Enviar la preinscripción (RF-PRE-02, RF-PRE-03)
      description: 'Registra la persona con discapacidad y su cuidador, la aceptación de la autorización (fecha, hora, IP y versión) y envía el correo de verificación. Una persona solo puede preinscribirse una vez por vigencia.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreinscripcionEntrada' }
      responses:
        '201':
          description: Preinscripción registrada; se envió el correo de verificación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreinscripcionCreada' }
        '400':
          description: El formulario venció, se envió demasiado rápido o fue rechazado (`FORMULARIO_INVALIDO`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Ya existe una solicitud (`SOLICITUD_EXISTENTE`), la autorización cambió (`AUTORIZACION_CAMBIO`) o no hay preinscripción abierta (`PREINSCRIPCION_CERRADA`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validacion' }
        '429': { $ref: '#/components/responses/DemasiadasPeticiones' }

  /publico/preinscripciones/verificar-correo:
    post:
      tags: [Portal ciudadano]
      summary: Verificar el correo con el enlace recibido (RF-PRE-04)
      description: 'Al verificar se envía la notificación de preinscripción exitosa con el siguiente paso y el enlace de consulta.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Resultado de la verificación
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado: { type: string, enum: [VERIFICADO, YA_VERIFICADO] }
        '400':
          description: Enlace inválido (`ENLACE_INVALIDO`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: El enlace venció (`ENLACE_VENCIDO`); se puede solicitar uno nuevo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/DemasiadasPeticiones' }

  /publico/preinscripciones/reenviar-verificacion:
    post:
      tags: [Portal ciudadano]
      summary: Reenviar el enlace de verificación del correo (RF-PRE-04)
      description: 'Responde siempre igual para no revelar qué identificaciones tienen solicitud. Limita la frecuencia de los reenvíos.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipoIdentificacionId, numero]
              properties:
                tipoIdentificacionId: { type: integer }
                numero: { type: string }
      responses:
        '202':
          description: Solicitud recibida
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje: { type: string }
        '422': { $ref: '#/components/responses/Validacion' }
        '429': { $ref: '#/components/responses/DemasiadasPeticiones' }

  /webhooks/correo:
    post:
      tags: [Correo]
      summary: Reporte de entrega o rebote de un correo (RNF-13)
      description: 'Lo llama el proveedor de correo. Se protege con el secreto compartido en la cabecera `x-webhook-secret`.'
      parameters:
        - { name: x-webhook-secret, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageId, evento]
              properties:
                messageId: { type: string }
                evento: { type: string, enum: [ENTREGADO, REBOTADO] }
                detalle: { type: string }
      responses:
        '200': { description: Estado del correo actualizado }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }

  /publico/consulta/solicitar-codigo:
    post:
      tags: [Portal ciudadano]
      summary: Pedir un código de un solo uso para consultar el estado (RF-PRE-05, RNF-05)
      description: 'Envía un código de 6 dígitos al correo verificado de la solicitud. Se indica la solicitud con el tipo y número de identificación de la persona con discapacidad o con el número de radicado. Responde siempre igual: no revela si la solicitud existe ni cuál es el correo. Limita la frecuencia (1 por minuto, 5 por hora).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentificacionConsulta' }
      responses:
        '202':
          description: Solicitud recibida
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje: { type: string }
        '422': { $ref: '#/components/responses/Validacion' }
        '429': { $ref: '#/components/responses/DemasiadasPeticiones' }

  /publico/consulta/verificar-codigo:
    post:
      tags: [Portal ciudadano]
      summary: Validar el código y abrir la sesión de consulta
      description: 'El código vale lo que indique el parámetro `otp_vigencia_minutos`, sirve una sola vez y se anula tras 5 intentos fallidos. Cualquier fallo responde igual (`CODIGO_INVALIDO`).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/IdentificacionConsulta' }
                - type: object
                  required: [codigo]
                  properties:
                    codigo: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Sesión de consulta abierta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionConsulta' }
        '401':
          description: Código inválido o vencido (`CODIGO_INVALIDO`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validacion' }
        '429': { $ref: '#/components/responses/DemasiadasPeticiones' }

  /publico/consulta/enlace:
    post:
      tags: [Portal ciudadano]
      summary: Abrir la sesión de consulta con el enlace seguro de las notificaciones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Sesión de consulta abierta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionConsulta' }
        '401':
          description: Enlace inválido (`ENLACE_INVALIDO`) o vencido (`ENLACE_VENCIDO`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/DemasiadasPeticiones' }

  /publico/consulta/solicitud:
    get:
      tags: [Portal ciudadano]
      summary: Estado de la solicitud (RF-PRE-05)
      description: 'Solo con la sesión que entregan el código o el enlace seguro. Muestra la etapa, el estado, una explicación en lenguaje claro, el siguiente paso y las comunicaciones enviadas.'
      security: [{ bearerCiudadano: [] }]
      responses:
        '200':
          description: Estado de la solicitud
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoSolicitud' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /publico/caracterizacion:
    get:
      tags: [Portal ciudadano]
      summary: Formulario de caracterización (RF-CAR-01, RF-CAR-02)
      description: 'Solo con la sesión que entregan el código o el enlace seguro. Devuelve los datos precargados de la preinscripción, lo que ya se guardó, los catálogos administrables y el avance por secciones. La sección del cuidador solo aparece si la persona indica que requiere el servicio.'
      security: [{ bearerCiudadano: [] }]
      responses:
        '200':
          description: Formulario con su avance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Caracterizacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Portal ciudadano]
      summary: Guardar el avance de la caracterización (RF-CAR-04, RNF-11)
      description: 'Guarda solo los campos enviados y acepta datos incompletos para poder retomar después. Rechaza los datos mal escritos o incoherentes con un mensaje por campo. Exige la versión que la persona vio: si otra ventana guardó antes responde 409. Guardar lo mismo no crea una versión nueva. Los datos de salud, etnia y subsidios se guardan cifrados.'
      security: [{ bearerCiudadano: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaracterizacionCambios' }
      responses:
        '200':
          description: Avance guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaracterizacionGuardada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: La información cambió en otra ventana (CONFLICTO_VERSION) o la solicitud ya no admite cambios (SOLICITUD_NO_EDITABLE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validacion' }
        '429': { $ref: '#/components/responses/DemasiadasPeticiones' }

  /publico/caracterizacion/documentos:
    get:
      tags: [Portal ciudadano]
      summary: Documentos que debe cargar la solicitud (RF-CAR-03)
      description: 'Lista los documentos exigidos según la parametrización vigente: los de la persona con discapacidad, los comunes y, solo si requiere servicio para el cuidador, los del cuidador. Cada uno con su estado (PENDIENTE, CARGADO o RECHAZADO), el archivo vigente y si hay un modelo para descargar.'
      security: [{ bearerCiudadano: [] }]
      responses:
        '200':
          description: Documentos y reglas de carga
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentosSolicitud' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /publico/caracterizacion/documentos/{documentoId}:
    post:
      tags: [Portal ciudadano]
      summary: Cargar o reemplazar un documento (RF-CAR-03, RNF-06)
      description: 'Valida el formato por el contenido real del archivo (no por su extensión), el tamaño máximo y los formatos del parámetro vigente. Se guarda cifrado, con fecha y hash SHA-256. Al reemplazar, el archivo anterior queda como «reemplazado»; nunca se borra.'
      security: [{ bearerCiudadano: [] }]
      parameters:
        - { name: documentoId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo: { type: string, format: binary }
      responses:
        '201':
          description: Documento cargado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentoSolicitud' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: La solicitud ya no admite cambios (SOLICITUD_NO_EDITABLE) o el documento no aplica (DOCUMENTO_NO_APLICA)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validacion' }
        '429': { $ref: '#/components/responses/DemasiadasPeticiones' }

  /publico/caracterizacion/documentos/{documentoId}/archivo:
    get:
      tags: [Portal ciudadano]
      summary: Descargar el archivo que cargó la persona
      description: 'Descifra el archivo y verifica su hash de integridad antes de entregarlo.'
      security: [{ bearerCiudadano: [] }]
      parameters:
        - { name: documentoId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Archivo
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /publico/caracterizacion/revision:
    get:
      tags: [Portal ciudadano]
      summary: Qué falta para poder enviar la solicitud (RF-CAR-04)
      security: [{ bearerCiudadano: [] }]
      responses:
        '200':
          description: Datos obligatorios y documentos pendientes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionSolicitud' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /publico/caracterizacion/radicar:
    post:
      tags: [Portal ciudadano]
      summary: Enviar la solicitud y generar el radicado (RF-CAR-04)
      description: 'Valida que estén completos los datos obligatorios y los documentos exigidos; genera un número de radicado único con fecha y hora (EST-AAAA-NNNNNN), cambia el estado a «Radicada» y envía la notificación con el siguiente paso, el enlace de consulta y la aclaración de que no equivale a la aprobación del beneficio. Después de radicar, la solicitud ya no se modifica.'
      security: [{ bearerCiudadano: [] }]
      responses:
        '201':
          description: Solicitud radicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Radicacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '409':
          description: Ya está radicada (YA_RADICADA) o todavía no se puede enviar (SOLICITUD_NO_EDITABLE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validacion' }
        '429': { $ref: '#/components/responses/DemasiadasPeticiones' }

  /publico/documentos/{documentoId}/modelo:
    get:
      tags: [Portal ciudadano]
      summary: Descargar el modelo de un documento (RF-CAR-03)
      description: 'Carta de solicitud o formato de carta de cuidador, si la Gerencia lo publicó. No requiere sesión.'
      parameters:
        - { name: documentoId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Archivo del modelo
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión (usuario y contraseña)
      description: Bloquea temporalmente la cuenta tras los intentos fallidos parametrizados.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
      responses:
        '200':
          description: Sesión iniciada. Fija la cookie `estimulo_rt`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionIniciada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: El acceso no está vigente (`ACCESO_NO_VIGENTE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validacion' }
        '429':
          description: Cuenta bloqueada temporalmente (`CUENTA_BLOQUEADA`) o demasiados intentos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      tags: [Autenticación]
      summary: Renovar el token de acceso con la cookie de sesión
      description: Rota el refresh token. También restaura la sesión al recargar la página.
      parameters:
        - $ref: '#/components/parameters/CabeceraPortal'
      responses:
        '200':
          description: Sesión renovada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionIniciada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Falta la cabecera del portal (`ORIGEN_NO_PERMITIDO`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar la sesión
      parameters:
        - $ref: '#/components/parameters/CabeceraPortal'
      responses:
        '204': { description: Sesión cerrada }
        '403':
          description: Falta la cabecera del portal (`ORIGEN_NO_PERMITIDO`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/me:
    get:
      tags: [Autenticación]
      summary: Perfil y permisos del usuario autenticado
      security: [{ bearerInterno: [] }]
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Perfil' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /auth/cambiar-password:
    post:
      tags: [Autenticación]
      summary: Cambiar la contraseña propia
      description: Cierra las demás sesiones y entrega una sesión nueva.
      security: [{ bearerInterno: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passwordActual, passwordNueva]
              properties:
                passwordActual: { type: string }
                passwordNueva:
                  {
                    type: string,
                    description: 'Mínimo 10 caracteres con mayúscula, minúscula, número y símbolo',
                  }
      responses:
        '200':
          description: Contraseña cambiada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionIniciada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '422': { $ref: '#/components/responses/Validacion' }

  /admin/roles:
    get:
      tags: [Administración de usuarios]
      summary: Roles, sus permisos y cuántos usuarios los tienen
      security: [{ bearerInterno: [] }]
      responses:
        '200':
          description: Roles (los del sistema primero)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Rol' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
    post:
      tags: [Administración de usuarios]
      summary: Crear un rol propio
      description: 'El código se genera del nombre. El nombre no puede repetirse (sin distinguir mayúsculas). Los permisos se eligen del catálogo; un rol puede crearse sin permisos y completarse después.'
      security: [{ bearerInterno: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolEntrada' }
      responses:
        '201':
          description: Rol creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rol' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /admin/roles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      tags: [Administración de usuarios]
      summary: Modificar un rol
      description: 'Un rol propio cambia de nombre, descripción y permisos. Un rol del sistema conserva su nombre y puede cambiar su descripción y sus permisos. El rol de administrador no se modifica (siempre tiene todos los permisos). El cambio de permisos rige de inmediato para quienes tienen el rol.'
      security: [{ bearerInterno: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolEntrada' }
      responses:
        '200':
          description: Rol modificado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rol' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/ReglaDeNegocio' }
        '422': { $ref: '#/components/responses/Validacion' }
    delete:
      tags: [Administración de usuarios]
      summary: Eliminar un rol propio
      description: 'Solo roles propios y sin usuarios asignados (ROL_EN_USO si los tiene; ROL_DEL_SISTEMA para los del documento).'
      security: [{ bearerInterno: [] }]
      responses:
        '204': { description: Rol eliminado }
        '401': { $ref: '#/components/responses/NoAutenticado' }
