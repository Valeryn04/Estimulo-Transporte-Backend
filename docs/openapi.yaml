      tags: [Asignación]
      summary: Modificar cupos, valor del estímulo, presupuesto o distribución
      description: 'multipart/form-data: el campo «datos» trae el JSON del cambio y «archivo» el soporte (por ejemplo, el acto de adición presupuestal), obligatorio al cambiar los cupos o el presupuesto. El motivo es obligatorio y cada cambio queda registrado de forma inmutable. Los cupos no pueden quedar por debajo de los ocupados ni el presupuesto por debajo de lo comprometido.'
      security: [{ bearerInterno: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [datos]
              properties:
                datos:
                  {
                    type: string,
                    description: 'JSON: cuposTotales?, valorEstimulo?, presupuestoTotal?, distribucionLocalidad? [{itemId, cupos}], distribucionTransporte? [{itemId, cupos}], motivo',
