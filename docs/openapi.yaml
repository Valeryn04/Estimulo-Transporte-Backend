      parameters:
        - {
            name: estado,
            in: query,
            schema:
              { type: string, enum: [RADICADA, SUBSANADA, EN_REVISION, EN_SUBSANACION, TODOS] },
          }
        - {
            name: asignado,
            in: query,
            schema: { type: string },
            description: 'mios, sin o el id de un validador',
          }
        - { name: q, in: query, schema: { type: string }, description: Radicado o nombre }
        - { name: vencidas, in: query, schema: { type: boolean } }
        - {
            name: orden,
            in: query,
            schema: { type: string, enum: [radicado, fecha, nombre, estado, dias] },
          }
        - { name: direccion, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: pagina, in: query, schema: { type: integer, default: 1 } }
        - { name: tamano, in: query, schema: { type: integer, default: 25, maximum: 100 } }
