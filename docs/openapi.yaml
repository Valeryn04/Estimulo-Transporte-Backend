        - { name: localidadId, in: query, schema: { type: integer } }
        - {
            name: poblacion,
            in: query,
            schema: { type: string, enum: [CON_CUIDADOR, SIN_CUIDADOR] },
          }
        - { name: etapa, in: query, schema: { type: string } }
      responses:
        '200': { description: Indicadores }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }
  /admin/reportes:
    get:
      tags: [Seguimiento]
      summary: Catálogo de reportes (RF-SEG-05)
      security: [{ bearerInterno: [] }]
      responses:
        '200': { description: Reportes disponibles }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
  /admin/reportes/exportaciones:
    get:
      tags: [Seguimiento]
      summary: Historial de exportaciones (RF-SEG-06)
      description: 'Quién exportó, qué reporte, con qué filtros, cuántas filas y la huella SHA-256 del archivo.'
      security: [{ bearerInterno: [] }]
      responses:
        '200': { description: Últimas exportaciones }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
  /admin/reportes/{codigo}:
    parameters:
      - { name: codigo, in: path, required: true, schema: { type: string } }
    get:
      tags: [Seguimiento]
      summary: Vista previa de un reporte
      description: 'Filtros comunes: vigencia, rango de fechas, localidad, estado y tipo de población. Devuelve hasta 200 filas y el total.'
      security: [{ bearerInterno: [] }]
      parameters:
        - { name: vigenciaId, in: query, schema: { type: integer } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: localidadId, in: query, schema: { type: integer } }
        - { name: estado, in: query, schema: { type: string } }
        - {
            name: poblacion,
            in: query,
            schema: { type: string, enum: [CON_CUIDADOR, SIN_CUIDADOR] },
          }
      responses:
        '200': { description: Tabla del reporte }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }
  /admin/reportes/{codigo}/exportar:
    parameters:
      - { name: codigo, in: path, required: true, schema: { type: string } }
    get:
      tags: [Seguimiento]
      summary: Exportar un reporte a Excel o PDF
      description: 'El archivo lleva los filtros en el encabezado y todas las filas. La exportación queda registrada en el historial y en la bitácora.'
      security: [{ bearerInterno: [] }]
      parameters:
        - { name: formato, in: query, required: true, schema: { type: string, enum: [XLSX, PDF] } }
        - { name: vigenciaId, in: query, schema: { type: integer } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: localidadId, in: query, schema: { type: integer } }
        - { name: estado, in: query, schema: { type: string } }
        - {
            name: poblacion,
            in: query,
            schema: { type: string, enum: [CON_CUIDADOR, SIN_CUIDADOR] },
          }
      responses:
        '200': { description: Archivo }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }
  /admin/bi/eventos:
    get:
      tags: [Seguimiento]
      summary: Eventos para tableros de Business Intelligence (RF-SEG-07)
      description: 'Eventos de la bitácora sin datos personales: el caso se identifica con una referencia irreversible. Paginación incremental con despuesDe. Formato json o csv.'
      security: [{ bearerInterno: [] }]
      parameters:
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: despuesDe, in: query, schema: { type: integer } }
        - { name: limite, in: query, schema: { type: integer } }
        - { name: formato, in: query, schema: { type: string, enum: [json, csv] } }
      responses:
        '200': { description: Eventos }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }
  /admin/seguimiento/filtros:
    get:
      tags: [Seguimiento]
      summary: Listas para filtrar bitácora, tablero y reportes
      security: [{ bearerInterno: [] }]
      responses:
        '200': { description: Vigencias, localidades y estados }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
  /publico/config:
    get:
      tags: [Portal ciudadano]
      summary: Configuración pública del portal
      description: 'Devuelve la llave del sitio de Cloudflare Turnstile (null si la verificación está desactivada). Con la verificación activa, la preinscripción, el reenvío del enlace, la solicitud del código de consulta y el inicio de sesión interno exigen la cabecera X-Turnstile-Token; sin ella responden 422 VERIFICACION_ROBOT.'
      responses:
        '200': { description: Configuración pública }
  /admin/novedades/beneficios/{id}/finalizar:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Novedades]
      summary: Finalizar el beneficio (RF-BEN-05)
      description: 'Multipart: «datos» (JSON con causalId, fechaEfectiva y observacion) y «archivo» con el soporte. Libera el cupo, alerta al asignador y avisa a la persona por correo. No se puede finalizar con una revocatoria en curso.'
      security: [{ bearerInterno: [] }]
      responses:
        '201': { description: Beneficio finalizado }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/ReglaDeNegocio' }
        '422': { $ref: '#/components/responses/Validacion' }
  /admin/novedades/beneficios/{id}/datos:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Novedades]
      summary: Actualizar la dirección, el correo o el cuidador del beneficiario (RF-BEN-05)
      description: 'Multipart: «datos» (JSON con dato = DIRECCION, CORREO o CUIDADOR, justificacion y los valores nuevos) y «archivo» con el soporte. Conserva el valor anterior. Un cuidador nuevo no puede tener otro beneficio vigente (RN-01) y su tarjeta se entrega después.'
      security: [{ bearerInterno: [] }]
      responses:
        '201': { description: Dato actualizado }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/ReglaDeNegocio' }
        '422': { $ref: '#/components/responses/Validacion' }
  /admin/novedades/datos/{id}/evidencia:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Novedades]
      summary: Descargar el soporte de una actualización de datos
      security: [{ bearerInterno: [] }]
      responses:
        '200': { description: Archivo }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /publico/consulta/revocatoria:
    get:
      tags: [Portal ciudadano]
      summary: Trámite de revocatoria en curso de la persona (RF-BEN-04)
      description: 'Muestra las razones trasladadas, el plazo y si todavía puede presentar descargos. Requiere la sesión de consulta.'
      security: [{ bearerCiudadano: [] }]
      responses:
        '200': { description: Revocatoria en curso o null }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /publico/consulta/descargos:
    post:
      tags: [Portal ciudadano]
      summary: Presentar descargos en una revocatoria (RF-BEN-04)
      description: 'Multipart: campo «texto» (mínimo 10 caracteres) y, opcionalmente, «archivo». Solo dentro del plazo del traslado.'
      security: [{ bearerCiudadano: [] }]
      responses:
        '201': { description: Descargos recibidos }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '409': { $ref: '#/components/responses/ReglaDeNegocio' }
        '422': { $ref: '#/components/responses/Validacion' }
  /admin/bitacora/exportar:
    get:
      tags: [Seguimiento]
      summary: Exportar la bitácora filtrada a Excel o PDF (RNF-07)
      description: 'Mismos filtros que la consulta. No incluye los valores anteriores y nuevos. La exportación queda registrada.'
      security: [{ bearerInterno: [] }]
      parameters:
        - { name: formato, in: query, required: true, schema: { type: string, enum: [XLSX, PDF] } }
        - { name: radicado, in: query, schema: { type: string } }
        - { name: usuario, in: query, schema: { type: string } }
        - { name: modulo, in: query, schema: { type: string } }
        - { name: accion, in: query, schema: { type: string } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Archivo }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }
  /admin/expedientes/{solicitudId}/correo:
    parameters:
      - { name: solicitudId, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Seguimiento]
      summary: Corregir el correo de la persona y reenviar lo rebotado (RF-COM-03)
      description: 'Multipart: «datos» (JSON con correo y justificacion) y «archivo» con el soporte. Reenvía con el texto exacto original las comunicaciones rebotadas que no se hayan reenviado.'
      security: [{ bearerInterno: [] }]
      responses:
        '201': { description: Correo actualizado, con la cantidad de comunicaciones reenviadas }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }
  /admin/expedientes/{solicitudId}/comunicaciones/{correoId}/reenviar:
    parameters:
      - { name: solicitudId, in: path, required: true, schema: { type: integer } }
      - { name: correoId, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Seguimiento]
      summary: Reenviar una comunicación rebotada al correo registrado hoy (RF-COM-03)
      description: 'Solo si el correo registrado cambió desde el rebote.'
      security: [{ bearerInterno: [] }]
      responses:
        '202': { description: La comunicación quedó en la cola de envío }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/ReglaDeNegocio' }
  /admin/bitacora/acciones:
    get:
      tags: [Seguimiento]
      summary: Acciones que aparecen en la bitácora
      security: [{ bearerInterno: [] }]
      responses:
        '200': { description: Lista de acciones }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

components:
  securitySchemes:
    bearerCiudadano:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Sesión de consulta del ciudadano (30 minutos), obtenida con el código o el enlace seguro.
    bearerInterno:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso de 10 minutos obtenido en `/auth/login`.
  parameters:
    CabeceraPortal:
      name: X-Requested-With
      in: header
      required: true
      schema: { type: string, enum: [estimulo-portal] }
      description: Cabecera que solo agrega el portal (defensa CSRF).
  schemas:
    EncuestaEntrada:
      type: object
      required: [titulo, desde, hasta, preguntas]
      properties:
        titulo: { type: string }
        descripcion: { type: string }
        desde: { type: string, format: date }
        hasta: { type: string, format: date }
        preguntas:
          type: array
          items:
            type: object
            required: [tipo, texto]
            properties:
              tipo: { type: string, enum: [SELECCION, ESCALA, TEXTO] }
              texto: { type: string }
              obligatoria: { type: boolean }
              opciones: { type: array, items: { type: string }, nullable: true }
              escalaMax: { type: integer, nullable: true }
    EntregaDatos:
      type: object
      required: [rol, tarjetaId, tipoTransporteId, fechaEntrega, receptorTipo]
      properties:
        rol: { type: string, enum: [PCD, CUIDADOR] }
        tarjetaId: { type: string }
        tipoTransporteId: { type: integer }
        fechaEntrega: { type: string, format: date }
        receptorTipo: { type: string, enum: [PCD, CUIDADOR, TERCERO] }
        receptorNombre: { type: string }
        receptorTipoIdentificacionId: { type: integer }
        receptorNumero: { type: string }
        terceroConAutorizacion:
          {
            type: boolean,
            description: 'Solo si recibe un tercero: presentó la autorización firmada',
          }
    AsignacionEntrada:
      type: object
      required: [solicitudIds]
      properties:
        solicitudIds: { type: array, items: { type: integer } }
    MatrizEntrada:
      type: object
      required: [variables]
      properties:
        notas: { type: string }
        desempate:
          type: array
          description: 'Criterios en orden: VARIABLE:<CODIGO> (gana el mayor aporte) o FECHA_RADICACION (gana la más antigua)'
          items: { type: string }
        variables:
          type: array
          items:
            type: object
            required: [codigo, nombre, origen, peso, opciones]
            properties:
              codigo: { type: string }
              nombre: { type: string }
              descripcion: { type: string }
              origen:
                {
                  type: string,
                  enum: [VALIDADOR, SUBSIDIOS],
                  description: 'VALIDADOR lo registra el validador; SUBSIDIOS sale de la caracterización',
                }
              peso: { type: number }
              opciones:
                type: array
                items:
                  type: object
                  required: [codigo, etiqueta, puntos]
                  properties:
                    codigo: { type: string }
                    etiqueta: { type: string }
                    puntos: { type: number }
    DecisionEntrada:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APROBAR, RECHAZAR] }
        motivo: { type: string, description: Obligatorio al rechazar }
    CruceEntrada:
      type: object
      required: [nombre, columnaIdentificacion, aplicaA]
      properties:
        nombre: { type: string }
        entidad: { type: string }
        descripcion: { type: string }
        columnaIdentificacion:
          { type: string, description: 'Encabezado de la columna con el número de identificación' }
        columnaDetalle:
          {
            type: string,
            nullable: true,
            description: 'Encabezado de la columna que se muestra en la alerta',
          }
        aplicaA: { type: string, enum: [PCD, CUIDADOR, AMBOS] }
    Salud:
      type: object
      required: [estado, baseDeDatos]
      properties:
        estado: { type: string, enum: [ok, degradado] }
        baseDeDatos: { type: string, enum: [ok, sin_conexion] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [codigo, mensaje]
          properties:
            codigo: { type: string }
            mensaje: { type: string }
            errores:
              type: array
              items:
                type: object
                properties:
                  campo: { type: string }
                  mensaje: { type: string }
            detalle: {}
    Login:
      type: object
      required: [usuario, password]
      properties:
        usuario: { type: string }
        password: { type: string }
    Perfil:
      type: object
      properties:
        id: { type: integer }
        usuario: { type: string }
        nombres: { type: string }
        correo: { type: string }
        roles:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              codigo: { type: string }
              nombre: { type: string }
        permisos:
          type: array
          items: { type: string }
        debeCambiarPassword: { type: boolean }
    SesionIniciada:
      type: object
      properties:
        token: { type: string }
        perfil: { $ref: '#/components/schemas/Perfil' }
        inactividadMinutos: { type: integer }
    Rol:
      type: object
      properties:
        id: { type: integer }
        codigo: { type: string }
        nombre: { type: string }
        descripcion: { type: string }
        sistema:
          {
            type: boolean,
            description: 'Rol del documento (numeral 3.2): no se elimina ni se renombra',
          }
        usuarios: { type: integer, description: Usuarios que tienen este rol }
        permisos:
          type: array
          items: { type: string }
    RolEntrada:
      type: object
      required: [nombre, descripcion, permisos]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 60 }
        descripcion: { type: string, minLength: 3, maxLength: 250 }
        permisos:
          type: array
          items: { type: string, example: catalogos.administrar }
    Permiso:
      type: object
      properties:
        codigo: { type: string, example: usuarios.administrar }
        modulo: { type: string }
        descripcion: { type: string }
    RolAsignado:
      type: object
      description: El rol del usuario (cada usuario tiene uno solo)
      properties:
        id: { type: integer }
        codigo: { type: string }
        nombre: { type: string }
    Usuario:
      type: object
      properties:
        id: { type: integer }
        usuario: { type: string }
        nombres: { type: string }
        correo: { type: string }
        estado: { type: string, enum: [ACTIVO, BLOQUEADO, BAJA] }
        bloqueoTemporalHasta: { type: string, format: date-time, nullable: true }
        debeCambiarPassword: { type: boolean }
        protegido: { type: boolean }
        ultimoLoginAt: { type: string, format: date-time, nullable: true }
        creadoAt: { type: string, format: date-time }
        rol:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RolAsignado'
    UsuarioNuevo:
      type: object
      required: [usuario, nombres, correo, rolId]
      properties:
        usuario:
          { type: string, description: '3 a 40 caracteres: minúsculas, números, punto, guion' }
        nombres: { type: string }
        correo: { type: string, format: email }
        rolId: { type: integer, description: El rol del usuario (uno solo) }
    UsuarioEdicion:
      type: object
      required: [nombres, correo, rolId]
      properties:
        nombres: { type: string }
        correo: { type: string, format: email }
        rolId: { type: integer, description: El rol del usuario (uno solo; reemplaza al anterior) }
    ResumenCatalogo:
      type: object
      properties:
        catalogo: { type: string }
        total: { type: integer }
        activos: { type: integer }
    ItemCatalogo:
      type: object
      properties:
        id: { type: integer }
        catalogo: { type: string }
        codigo: { type: string }
        nombre: { type: string }
        padreId: { type: integer, nullable: true, description: Localidad del barrio }
        padreNombre: { type: string, nullable: true }
        activo: { type: boolean }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
    ItemEntrada:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string }
        codigo: { type: string, description: Opcional; obligatorio en tipos de identificación }
        padreId: { type: integer, nullable: true, description: Obligatorio en barrios }
    VersionRegistro:
      type: object
      properties:
        version: { type: integer }
        snapshot: { type: object, description: Copia completa del registro en esa versión }
        usuario: { type: string, nullable: true }
        creadoAt: { type: string, format: date-time }
    DocumentoRequerido:
      type: object
      properties:
        id: { type: integer }
        codigo: { type: string }
        nombre: { type: string }
        descripcion: { type: string }
        aplicaA: { type: string, enum: [PCD, CUIDADOR, COMUN] }
        obligatorio: { type: boolean }
        activo: { type: boolean }
        version: { type: integer }
        modelo:
          type: object
          nullable: true
          description: Modelo descargable que publicó la Gerencia (por ejemplo, la carta de solicitud)
          properties:
            nombre: { type: string }
            formato: { type: string, enum: [pdf, docx, odt] }
            tamanoBytes: { type: integer }
            cargadoAt: { type: string, format: date-time }
    Subsanacion:
      type: object
      nullable: true
      properties:
        estado: { type: string, enum: [ABIERTA, VENCIDA, RESPONDIDA] }
        venceAt: { type: string, format: date-time }
        respondidaAt: { type: string, format: date-time, nullable: true }
        puedeResponder: { type: boolean }
        items:
          type: array
          items:
            type: object
            properties:
              nombre: { type: string }
              observacion: { type: string }
              documentoId: { type: integer, nullable: true }
              campos: { type: array, items: { type: string } }
        documentosEditables: { type: array, items: { type: integer } }
        camposEditables: { type: array, items: { type: string } }
    RequisitoEntrada:
      type: object
      required: [nombre, aplicaA]
      properties:
        nombre: { type: string }
        descripcion: { type: string }
        aplicaA: { type: string, enum: [PCD, CUIDADOR, COMUN] }
        fuenteSugerida: { type: string }
        documentoId: { type: integer, nullable: true }
        campos: { type: array, items: { type: string } }
        cruceCodigo: { type: string, nullable: true }
    DocumentoEntrada:
      type: object
      required: [nombre, aplicaA, obligatorio]
      properties:
        nombre: { type: string }
        descripcion: { type: string }
        aplicaA: { type: string, enum: [PCD, CUIDADOR, COMUN] }
        obligatorio: { type: boolean }
    VersionParametro:
      type: object
      properties:
        id: { type: integer }
        valor: { type: string }
        vigenteDesde: { type: string, format: date-time }
        aprobadoPor: { type: string, nullable: true }
        justificacion: { type: string, nullable: true }
        creadoAt: { type: string, format: date-time }
    Parametro:
      type: object
      properties:
        clave: { type: string }
        grupo: { type: string }
        descripcion: { type: string }
        tipo: { type: string, enum: [ENTERO, TEXTO, BOOLEANO] }
        minimo: { type: integer, nullable: true }
        maximo: { type: integer, nullable: true }
        patron: { type: string, nullable: true }
        pendienteDefinicion:
          { type: boolean, description: Valor inicial a confirmar por la Gerencia }
        vigente: { $ref: '#/components/schemas/VersionParametro' }
        programada: { allOf: [{ $ref: '#/components/schemas/VersionParametro' }], nullable: true }
    VersionParametroEntrada:
      type: object
      required: [valor, justificacion]
      properties:
        valor: { type: string }
        vigenteDesde:
          { type: string, format: date-time, nullable: true, description: Vacío = desde ya }
        justificacion: { type: string, minLength: 5 }
    Vigencia:
      type: object
      properties:
        id: { type: integer }
        anio: { type: integer }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }
        cuposTotales: { type: integer }
        activa: { type: boolean }
        version: { type: integer }
    VigenciaNueva:
      type: object
      required: [anio, fechaInicio, fechaFin, cuposTotales]
      properties:
        anio: { type: integer }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }
        cuposTotales: { type: integer, minimum: 0 }
    VigenciaEdicion:
      type: object
      required: [fechaInicio, fechaFin, cuposTotales]
      properties:
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }
        cuposTotales: { type: integer, minimum: 0 }
    TextoAutorizacion:
      type: object
      properties:
        version: { type: integer }
        contenido: { type: string }
        vigenteDesde: { type: string, format: date-time }
        creadoPor: { type: string, nullable: true }
    AutorizacionEstado:
      type: object
      properties:
        vigente: { $ref: '#/components/schemas/TextoAutorizacion' }
        versiones:
          type: array
          items: { $ref: '#/components/schemas/TextoAutorizacion' }
    AutorizacionEntrada:
      type: object
      required: [contenido]
      properties:
        contenido: { type: string, minLength: 50, maxLength: 20000 }
    PlantillaResumen:
      type: object
      properties:
        codigo: { type: string }
        nombre: { type: string }
        descripcion: { type: string }
        version: { type: integer }
        actualizadaAt: { type: string, format: date-time }
    PlantillaVersion:
      type: object
      properties:
        version: { type: integer }
        asunto: { type: string }
        cuerpo: { type: string }
        justificacion: { type: string, nullable: true }
        creadoPor: { type: string, nullable: true }
        creadoAt: { type: string, format: date-time }
    Plantilla:
      type: object
      properties:
        codigo: { type: string }
        nombre: { type: string }
        descripcion: { type: string }
        variables:
          type: array
          items:
            type: object
            properties:
              nombre: { type: string }
              descripcion: { type: string }
              obligatoria: { type: boolean }
        vigente: { $ref: '#/components/schemas/PlantillaVersion' }
        versiones:
          type: array
          items: { $ref: '#/components/schemas/PlantillaVersion' }
    PlantillaEntrada:
      type: object
      required: [asunto, cuerpo]
      properties:
        asunto: { type: string }
        cuerpo: { type: string }
    PlantillaVersionEntrada:
      type: object
      required: [asunto, cuerpo]
      properties:
        asunto: { type: string }
        cuerpo: { type: string }
        justificacion: { type: string, nullable: true }
    VistaPrevia:
      type: object
      properties:
        asunto: { type: string }
        cuerpo: { type: string }
        variablesUsadas:
          type: array
          items: { type: string }
        problemas:
          type: array
          items: { type: string }
    FormularioPreinscripcion:
      type: object
      properties:
        abierta:
          { type: boolean, description: Hay una vigencia activa y hoy está dentro de sus fechas }
        anio: { type: integer, nullable: true }
        tiposIdentificacion:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              codigo: { type: string }
              nombre: { type: string }
        localidades:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              nombre: { type: string }
        barrios:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              nombre: { type: string }
              localidadId: { type: integer, nullable: true }
        autorizacion:
          type: object
          nullable: true
          properties:
            version: { type: integer }
            contenido: { type: string }
        formularioToken:
          {
            type: string,
            description: Se devuelve en el envío; sirve para detectar envíos automatizados,
          }
    PreinscripcionEntrada:
      type: object
      required:
        [
          pcdNombre,
          pcdTipoIdentificacionId,
          pcdNumero,
          correo,
          correoConfirmacion,
          aceptaAutorizacion,
          autorizacionVersion,
          formularioToken,
        ]
      properties:
        pcdNombre: { type: string }
        pcdTipoIdentificacionId: { type: integer }
        pcdNumero: { type: string }
        diligenciadaPor:
          { type: string, enum: [PCD, CUIDADOR], description: 'Quién llena el formulario' }
        tieneCuidador:
          {
            type: boolean,
            description: 'false si la persona no tiene cuidador; si no se envía, se piden los datos del cuidador',
          }
        cuidadorNombre: { type: string, description: Obligatorio salvo que tieneCuidador sea false }
        cuidadorTipoIdentificacionId:
          { type: integer, description: Obligatorio salvo que tieneCuidador sea false }
        cuidadorNumero: { type: string, description: Obligatorio salvo que tieneCuidador sea false }
        direccion:
          type: string
          nullable: true
          description: 'Opcional. Formato estándar armado por el portal: tipo de vía, número, # cruce - placa y complemento. Ejemplo: Carrera 54 B Bis Sur # 72 A - 30 Este, Apto 301'
          example: Calle 72 # 54 - 30
        localidadId: { type: integer, nullable: true }
        barrioId: { type: integer, nullable: true }
        correo: { type: string, format: email }
        correoConfirmacion:
          {
            type: string,
            format: email,
            description: El mismo correo escrito otra vez; debe coincidir,
          }
        aceptaAutorizacion: { type: boolean, enum: [true] }
        autorizacionVersion: { type: integer }
        formularioToken: { type: string }
        contactoAlterno: { type: string, description: 'Campo trampa: debe ir vacío' }
    PreinscripcionCreada:
      type: object
      properties:
        correoEnmascarado: { type: string, example: 'f****@correo.com' }
        horasVigenciaEnlace: { type: integer }
    IdentificacionPcd:
      type: object
      required: [tipoIdentificacionId, numero]
      properties:
        tipoIdentificacionId: { type: integer }
        numero: { type: string, description: Identificación de la persona con discapacidad }
    SesionConsulta:
      type: object
      properties:
        token: { type: string, description: Token de la sesión del ciudadano; se envía como Bearer }
        expiraEnMinutos: { type: integer }
    ItemLista:
      type: object
      properties:
        id: { type: integer }
        codigo: { type: string }
        nombre: { type: string }
    DatosCaracterizacion:
      type: object
      description: Todos los campos pueden ser nulos mientras la persona va diligenciando.
      properties:
        generoId: { type: integer, nullable: true }
        telefonoFijo:
          { type: string, nullable: true, description: '7 dígitos, o 10 con el indicativo 60' }
        celular: { type: string, nullable: true, description: '10 dígitos que empiezan por 3' }
        fechaNacimiento: { type: string, format: date, nullable: true }
        estadoCivilId: { type: integer, nullable: true }
        tieneHijos: { type: boolean, nullable: true }
        hijosCantidad: { type: integer, minimum: 1, maximum: 20, nullable: true }
        hijosEdades:
          type: array
          nullable: true
          description: Una edad por hijo (0 a 100); una posición nula es una edad que falta
          items: { type: integer, nullable: true }
        etniaId: { type: integer, nullable: true }
        escolaridadId: { type: integer, nullable: true }
        ocupacionId: { type: integer, nullable: true }
        epsId: { type: integer, nullable: true }
        embarazo: { type: string, enum: [NO, SI, NO_APLICA], nullable: true }
        semanasGestacion: { type: integer, minimum: 1, maximum: 42, nullable: true }
        recibeSubsidios: { type: boolean, nullable: true }
        subsidioCual: { type: string, nullable: true }
        tipoTransporteId: { type: integer, nullable: true }
        justificacionTransporte: { type: string, nullable: true }
        requiereCuidador: { type: boolean, nullable: true }
        cuidadorGeneroId: { type: integer, nullable: true }
        cuidadorTelefonoFijo: { type: string, nullable: true }
        cuidadorCelular: { type: string, nullable: true }
        cuidadorCorreo: { type: string, nullable: true }
    CaracterizacionCambios:
      allOf:
        - $ref: '#/components/schemas/DatosCaracterizacion'
        - type: object
          required: [version]
          properties:
            version:
              {
                type: integer,
                minimum: 0,
                description: La versión que la persona vio (0 si aún no hay nada guardado),
              }
            pcdNombre:
              {
                type: string,
                description: Corrige el nombre de la persona con discapacidad; queda en el historial,
              }
            cuidadorNombre:
              { type: string, description: Solo si el cuidador no figura en otra solicitud }
    SeccionAvance:
      type: object
      properties:
        codigo:
          { type: string, enum: [datos-personales, situacion, salud-apoyos, transporte, cuidador] }
        nombre: { type: string }
        requeridos: { type: integer }
        completados: { type: integer }
        completa: { type: boolean }
        faltantes:
          type: array
          items:
            type: object
            properties:
              campo: { type: string }
              mensaje: { type: string }
    Avance:
      type: object
      properties:
        secciones:
          type: array
          items: { $ref: '#/components/schemas/SeccionAvance' }
        requeridos: { type: integer }
        completados: { type: integer }
        porcentaje: { type: integer, minimum: 0, maximum: 100 }
        completa: { type: boolean }
    CaracterizacionGuardada:
      type: object
      properties:
        version: { type: integer }
        guardadoAt: { type: string, format: date-time, nullable: true }
        pcdNombre: { type: string }
        cuidadorNombre: { type: string }
        datos: { $ref: '#/components/schemas/DatosCaracterizacion' }
        avance: { $ref: '#/components/schemas/Avance' }
    Caracterizacion:
      type: object
      properties:
        solicitud:
          type: object
          properties:
            vigencia: { type: integer }
            estado:
              type: object
              properties:
                codigo: { type: string }
                nombre: { type: string }
            editable: { type: boolean }
            explicacion: { type: string }
            siguientePaso: { type: string }
            radicado: { type: string, nullable: true, example: EST-2026-000123 }
            radicadaAt: { type: string, format: date-time, nullable: true }
        pcd:
          type: object
          properties:
            nombre: { type: string }
            tipoIdentificacion: { $ref: '#/components/schemas/ItemLista' }
            numero: { type: string }
            correo: { type: string }
        cuidador:
          type: object
          properties:
            nombre: { type: string }
            tipoIdentificacion: { $ref: '#/components/schemas/ItemLista' }
            numero: { type: string }
            nombreEditable: { type: boolean }
        datos: { $ref: '#/components/schemas/DatosCaracterizacion' }
        avance: { $ref: '#/components/schemas/Avance' }
        version: { type: integer }
        guardadoAt: { type: string, format: date-time, nullable: true }
        catalogos:
          type: object
          properties:
            generos: { type: array, items: { $ref: '#/components/schemas/ItemLista' } }
            estadosCiviles: { type: array, items: { $ref: '#/components/schemas/ItemLista' } }
            etnias: { type: array, items: { $ref: '#/components/schemas/ItemLista' } }
            escolaridades: { type: array, items: { $ref: '#/components/schemas/ItemLista' } }
            ocupaciones: { type: array, items: { $ref: '#/components/schemas/ItemLista' } }
            eps: { type: array, items: { $ref: '#/components/schemas/ItemLista' } }
            tiposTransporte: { type: array, items: { $ref: '#/components/schemas/ItemLista' } }
    IdentificacionConsulta:
      type: object
      description: Con el radicado, o con el tipo y número de identificación de la persona con discapacidad.
      properties:
        radicado: { type: string, pattern: '^EST-[0-9]{4}-[0-9]{6}$', example: EST-2026-000123 }
        tipoIdentificacionId: { type: integer }
        numero: { type: string }
    ArchivoDocumento:
      type: object
      nullable: true
      properties:
        nombre: { type: string }
        formato: { type: string, enum: [pdf, jpg, png] }
        tamanoBytes: { type: integer }
        sha256: { type: string, description: Hash de integridad del contenido }
        cargadoAt: { type: string, format: date-time }
    DocumentoSolicitud:
      type: object
      properties:
        id: { type: integer }
        codigo: { type: string }
        nombre: { type: string }
        descripcion: { type: string }
        aplicaA: { type: string, enum: [PCD, CUIDADOR, COMUN] }
        obligatorio: { type: boolean }
        estado: { type: string, enum: [PENDIENTE, CARGADO, RECHAZADO] }
        reemplazos: { type: integer, description: Cuántas veces se reemplazó el archivo }
        archivo: { $ref: '#/components/schemas/ArchivoDocumento' }
        tieneModelo: { type: boolean }
    DocumentosSolicitud:
      type: object
      properties:
        editable: { type: boolean }
        reglas:
          type: object
          properties:
            formatos:
              type: array
              items: { type: string, enum: [pdf, jpg, png] }
            maxMb: { type: integer }
        documentos:
          type: array
          items: { $ref: '#/components/schemas/DocumentoSolicitud' }
        resumen:
          type: object
          properties:
            obligatorios: { type: integer }
            cargados: { type: integer }
            completo: { type: boolean }
    PendienteRadicacion:
      type: object
      properties:
        campo:
          { type: string, description: 'Nombre del campo, o «documento:ID» si es un documento' }
        seccion: { type: string }
        mensaje: { type: string }
    RevisionSolicitud:
      type: object
      properties:
        completo: { type: boolean }
        datos:
          type: array
          items: { $ref: '#/components/schemas/PendienteRadicacion' }
        documentos:
          type: array
          items: { $ref: '#/components/schemas/PendienteRadicacion' }
    Radicacion:
      type: object
      properties:
        radicado: { type: string, example: EST-2026-000123 }
        radicadaAt: { type: string, format: date-time }
        estado:
          type: object
          properties:
            codigo: { type: string }
            nombre: { type: string }
        explicacion: { type: string }
        siguientePaso: { type: string }
        aviso: { type: string }
    EstadoSolicitud:
      type: object
      properties:
        vigencia: { type: integer }
        personaConDiscapacidad: { type: string }
        correo: { type: string, example: 'f****@correo.com', description: Correo enmascarado }
        fechaPreinscripcion: { type: string, format: date-time }
        radicado: { type: string, nullable: true, example: EST-2026-000123 }
        fechaRadicacion: { type: string, format: date-time, nullable: true }
        etapa: { type: string }
        estado:
          type: object
          properties:
            codigo: { type: string }
            nombre: { type: string }
        explicacion: { type: string }
        siguientePaso: { type: string }
        aviso: { type: string }
        comunicaciones:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              nombre: { type: string }
              asunto: { type: string }
              enviadoAt: { type: string, format: date-time }
              entrega:
                {
                  type: string,
                  description: 'Pendiente de envío, Enviado, Entregado, No se pudo entregar o No se pudo enviar',
                }
    Motivo:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 5, maxLength: 500 }
  responses:
    DemasiadasPeticiones:
      description: Demasiadas peticiones desde esta conexión (`DEMASIADOS_INTENTOS`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Validacion:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoAutenticado:
      description: Sin sesión válida o credenciales incorrectas
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SinPermiso:
      description: El rol no tiene el permiso necesario
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoEncontrado:
      description: El recurso no existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ReglaDeNegocio:
      description: La operación viola una regla de negocio
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
