                  {
                    type: string,
                    description: 'JSON: rol (PCD | CUIDADOR), tarjetaId, tipoTransporteId, fechaEntrega (AAAA-MM-DD), receptorTipo (PCD | CUIDADOR | TERCERO), receptorNombre / receptorTipoIdentificacionId / receptorNumero / terceroConAutorizacion (si es un tercero; debe ser true). El funcionario que entrega es quien tiene la sesión',
